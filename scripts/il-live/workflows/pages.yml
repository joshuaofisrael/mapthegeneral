name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_scope:
        description: "all = every URL; il = only the Israel results pages (live-results rebuilds)"
        default: all

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://mapthegeneral.com

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout IndexNow URL list
        uses: actions/checkout@v4

      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_SCOPE: ${{ inputs.indexnow_scope || 'all' }}
        run: |
          python3 - << 'PY'
          import json, urllib.request
          from pathlib import Path
          key = Path("public/a7c3e91b4d2f4086b5e0c1a9d8f74632.txt").read_text().strip()
          import os
          urls = json.loads(Path("public/search/indexnow-urls.json").read_text())
          if os.environ.get("INDEXNOW_SCOPE") == "il":
            urls = ["https://mapthegeneral.com/il/he/results/", "https://mapthegeneral.com/il/en/results/"]
          # New Zealand freeze: 00:00–19:00 NZDT on 7 Nov 2026 (11:00Z 6 Nov–06:00Z 7 Nov).
          from datetime import datetime, timezone
          freeze_start = datetime.fromisoformat("2026-11-06T11:00:00+00:00")
          freeze_end = datetime.fromisoformat("2026-11-07T06:00:00+00:00")
          if freeze_start <= datetime.now(timezone.utc) < freeze_end:
            urls = [url for url in urls if "/nz/" not in url]
          for start in range(0, len(urls), 10000):
            body = json.dumps({
              "host": "mapthegeneral.com",
              "key": key,
              "keyLocation": f"https://mapthegeneral.com/{key}.txt",
              "urlList": urls[start:start + 10000],
            }).encode()
            req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
            )
            with urllib.request.urlopen(req, timeout=30) as res:
              print(start, res.status)
          PY
