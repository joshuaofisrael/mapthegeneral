name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://mapthegeneral.com

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout IndexNow URL list
        uses: actions/checkout@v4

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python3 - << 'PY'
          import json, urllib.request
          from pathlib import Path
          key = Path("public/a7c3e91b4d2f4086b5e0c1a9d8f74632.txt").read_text().strip()
          urls = json.loads(Path("public/search/indexnow-urls.json").read_text())
          for start in range(0, len(urls), 10000):
            body = json.dumps({
              "host": "mapthegeneral.com",
              "key": key,
              "keyLocation": f"https://mapthegeneral.com/{key}.txt",
              "urlList": urls[start:start + 10000],
            }).encode()
            req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
            )
            with urllib.request.urlopen(req, timeout=30) as res:
              print(start, res.status)
          PY
